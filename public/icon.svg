<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="q1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="q2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="q3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="q4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- 4 Quadrants -->
  <g filter="url(#shadow)">
    <!-- Q1 Urgent & Important (Red) -->
    <rect x="96" y="96" width="144" height="144" rx="24" fill="url(#q1)" />
    <!-- Q2 Important, Not Urgent (Blue) -->
    <rect x="272" y="96" width="144" height="144" rx="24" fill="url(#q2)" />
    <!-- Q3 Urgent, Not Important (Amber) -->
    <rect x="96" y="272" width="144" height="144" rx="24" fill="url(#q3)" />
    <!-- Q4 Not Urgent, Not Important (Green) -->
    <rect x="272" y="272" width="144" height="144" rx="24" fill="url(#q4)" />
  </g>

  <!-- Center Target / Crosshair Node -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" />
  <circle cx="256" cy="256" r="14" fill="#6366f1" />
</svg>
